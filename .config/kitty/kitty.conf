# kitty.conf - only the options that differ from kitty's defaults.
# See kitty.conf(5) or https://sw.kovidgoyal.net/kitty/conf/ for the rest.

# Fonts
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14
disable_ligatures never

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 20000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0

# Mouse
mouse_hide_wait -1
url_style curly

# Bell
enable_audio_bell no
visual_bell_duration 1

# Window layout
window_border_width 0px
window_margin_width 0
hide_window_decorations no

# Colours: Tokyo Night Storm, written by "kitten themes"
include current-theme.conf

# Advanced
# Tuned bash 5.3 (PGO+LTO+BOLT) from /opt/bash-5.3, see /opt/bash-5.3/BUILD-NOTES.md.
# Interactive kitty shells only; login shell and scripts stay on /usr/bin/bash.
# To revert: shell .
shell /home/mb6ockatf/.local/opt/bash/bin/bash
