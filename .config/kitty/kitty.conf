# kitty.conf - only the options that differ from kitty's defaults.
# See kitty.conf(5) or https://sw.kovidgoyal.net/kitty/conf/ for the rest.

# Fonts
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14
disable_ligatures never

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 0
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0

# Mouse
mouse_hide_wait -1
url_style curly

# Performance
repaint_delay 1000
input_delay 100

# Bell
enable_audio_bell no
visual_bell_duration 1

# Window layout
window_border_width 0px
window_margin_width 0
hide_window_decorations no

# Colours: the theme overrides the background, current-theme.conf
# (written by "kitty +kitten themes") overrides both
background #000000
include ~/.config/kitty/kitty-themes/themes/tokyonight_night.conf

# Advanced
shell .

# Keyboard shortcuts
map ctrl+cmd+f    toggle_fullscreen

include current-theme.conf
