[flags]

color = "default"
dot_marker = false
temperature_type = "c"
rate = 1000
default_widget_type = "proc"
default_widget_count = 1
enable_gpu = false
disable_click = false
hide_avg_cpu = false
use_current_cpu_total = false
show_table_scroll_position = true
process_command = true

[processes]
columns = ["pid", "name", "cpu%", "mem%"]

[net]
graph_symbol = "braille"

[[row]]
	ratio = 25
	[[row.child]]
		ratio = 1
		type = "cpu"
		default_widget_count = 1
		graph_symbol = "braille"
		show_kernel_threads = false
		show_user_threads = false

[disk_filter]
is_list_ignored = true
list = [""]
regex = false

[[row]]
  ratio = 25
  [[row.child]]
    ratio = 1
    type = "mem"
  [[row.child]]
    ratio = 1
    type = "net"
  [[row.child]]
    ratio = 1
    type = "temp"

[[row]]
  ratio = 20
  [[row.child]]
    type = "proc"
