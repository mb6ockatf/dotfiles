# Swap tuning for zram (compressed swap in RAM, used before the disk swap).
# Swapping to zram is cheap, so let the kernel move idle memory there
# earlier (default 60) instead of dropping program code and file cache,
# and swap in single pages rather than 8-page clusters (default 3), which
# only help on rotating disks.
vm.swappiness = 180
vm.page-cluster = 0
